[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-content-manager"
version = "0.1.0"
description = "A sequential CrewAI pipeline for researching, drafting, reviewing, optimizing, and scheduling LinkedIn posts."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["linkedin_content_manager*"]

[tool.setuptools.package-data]
linkedin_content_manager = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
